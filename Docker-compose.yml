services:

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backand

  backand:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: backand

    volumes:
      - sqlite_db:/data
      - .:/app

    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload  

volumes:                       
  sqlite_db:     